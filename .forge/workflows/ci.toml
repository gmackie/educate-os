# SchoolOS CI on ForgeGraph runners. The gate is the repository's own `pnpm lint` (oxlint, script
# types, generated configs and the full workspace build) plus every SchoolOS package's tests.
version = 1

[environment]
node = "24"

[build]
command = "corepack enable && pnpm install --frozen-lockfile && pnpm lint"

[test]
command = "node scripts/vp/run.ts --cache --fail-if-no-match --filter='@schoolos/*' test"
