name: Launch operations (isolated)
on:
  pull_request:
    paths:
      - 'tools/launch-ops/**'
      - '.forgejo/workflows/launch-ops.yml'
      - '.github/workflows/launch-ops.yml'
  push:
    branches: [main]
    paths:
      - 'tools/launch-ops/**'
      - '.forgejo/workflows/launch-ops.yml'
      - '.github/workflows/launch-ops.yml'
permissions:
  contents: read
jobs:
  local-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: '11.17.0'
          run_install: false
      - name: Lint isolated local tool
        run: pnpm --config.store-dir=/tmp/launch-ops-pnpm --config.cache-dir=/tmp/launch-ops-cache dlx oxlint@1.90.0 --deny-warnings tools/launch-ops/src tools/launch-ops/web/app.js tools/launch-ops/test
      - name: Check JavaScript syntax
        run: |
          for file in tools/launch-ops/src/*.mjs tools/launch-ops/web/app.js tools/launch-ops/test/*.mjs; do
            node --check "$file"
          done
      - name: Run offline safety and workflow tests
        run: node --test tools/launch-ops/test/*.test.mjs
