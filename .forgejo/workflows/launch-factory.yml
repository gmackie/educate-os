name: Launch Factory
on:
  pull_request:
    paths:
      - "tools/launch-factory/**"
      - ".forgejo/workflows/launch-factory.yml"
  push:
    branches: [main]
    paths:
      - "tools/launch-factory/**"
      - ".forgejo/workflows/launch-factory.yml"
permissions:
  contents: read
jobs:
  synthetic-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - run: corepack enable
      - name: Install standalone locked package
        working-directory: tools/launch-factory
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Install local media tools and isolated Chromium
        working-directory: tools/launch-factory
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          # Avoid optional GPU driver bundles for this CPU-only render. Keep apt's hash checks.
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg espeak-ng
          pnpm exec playwright install --with-deps chromium
      - name: Unit and safety tests
        working-directory: tools/launch-factory
        run: pnpm test
      - name: Smoke-check 82 scenes and render full V01 draft
        working-directory: tools/launch-factory
        env:
          LAUNCH_FACTORY_E2E_RUN: runs/ci
        run: pnpm run test:e2e
      - name: Retain synthetic draft evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: launch-factory-internal-drafts
          path: |
            tools/launch-factory/runs/ci/renders/
            tools/launch-factory/runs/ci/manifest.json
            tools/launch-factory/runs/ci/preflight-*.json
          retention-days: 7
          if-no-files-found: error
