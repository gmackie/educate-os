# EducateOS CI on ForgeGraph (git.forgegraf.com). Forgejo ignores .github/workflows when this
# directory exists, so the upstream Cloudflare workflows (CLA, contribution policy, previews, evals)
# do not run here; GitHub (gmackie/school-os) only mirrors commits.
#
# The required gate is the repository's own `pnpm lint` (oxlint, script types, generated configs and
# the full workspace build) plus every EducateOS package's tests. The upstream Workshop suites are
# kept in a separate job so a kernel regression is still visible.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request supersedes the run in progress; stacked branches are
# re-pushed often, and stale runs only add load to the shared runners.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24.19.0"
  # The runners are shared hosts and each job's container gets 6 CPUs and 8 GiB. At the computed
  # concurrency of 4, workerd test fleets starve each other: tests that take ~30 ms locally took
  # 5-20 s, and a workerd suite went 60 s without output and was killed by the watchdog. Run two
  # tasks at a time and give the watchdog the slow-runner bounds docs/testing.md recommends.
  VP_RUN_CONCURRENCY_LIMIT: "2"
  TESTS_WITH_TIMEOUT_IDLE_SECONDS: "300"
  TESTS_WITH_TIMEOUT_MAX_SECONDS: "1500"
  # Vitest's own per-test (5 s default) and per-hook (10 s) timeouts still tripped at that
  # concurrency: @educateos/ai-guard's guard.test.ts (run 195), durable-object-store tests (runs
  # 190/191) and a gatekeeper conformance race (run 187). These are floors, not overrides: a package
  # that sets a longer timeout keeps it, and local runs are unchanged (SCHO-160, docs/testing.md).
  VITEST_TEST_TIMEOUT: "60000"
  VITEST_HOOK_TIMEOUT: "60000"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # pnpm's version and integrity hash come from `packageManager` in package.json.
      - name: Enable Corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Lint and build
        run: pnpm lint

      - name: Test EducateOS packages
        run: node scripts/vp/run.ts --cache --fail-if-no-match --filter='@educateos/*' test

      - name: Report CI result to ForgeGraph
        if: always()
        env:
          FG_CI_TOKEN: ${{ secrets.FORGEGRAPH_TOKEN }}
        run: |
          case "${{ job.status }}" in
            success) STATUS=success ;;
            cancelled) STATUS=cancelled ;;
            *) STATUS=failure ;;
          esac
          REPO_FULL="${{ github.repository }}"
          curl -sf -X POST "https://forgegraf.com/api/fg/ci/report" \
            -H "Authorization: Bearer ${FG_CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"owner\": \"${REPO_FULL%%/*}\",
              \"repo\": \"${REPO_FULL##*/}\",
              \"sha\": \"${{ github.event.pull_request.head.sha || github.sha }}\",
              \"branch\": \"${{ github.head_ref || github.ref_name }}\",
              \"status\": \"${STATUS}\",
              \"runId\": \"${{ github.run_id }}\",
              \"runUrl\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"workflowName\": \"CI\"
            }" || echo "::warning::Failed to report CI result to ForgeGraph"

  # Not part of the reported gate: upstream's own suites, which EducateOS changes should not break.
  workshop-tests:
    # After the gate rather than beside it: both jobs start workerd test fleets, and running them at
    # once on a shared runner host starved each other's tests into timeouts.
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Test Workshop packages (browser suites excluded)
        run: >-
          node scripts/vp/run.ts --cache --fail-if-no-match
          --filter=!cloudflare-os --filter='!@educateos/*'
          --filter=!@gadgets/workshop-frontend --filter=!@gadgets/configurator-ui
          test
